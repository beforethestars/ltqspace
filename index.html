<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ltqspace</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Crimson+Pro:wght@400;600;700&family=Cormorant+Garamond:ital,wght@1,400;1,500&display=swap">
<style>
:root{--bg:#fbf7f1;--fg:#2b2622;--mute:#7d7369;--soft:#e8ddd0;--btn:#2b2622;--btnfg:#fff7ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141414;--fg:#f1f1f1;--mute:#a09a93;--soft:#333;--btn:#f1f1f1;--btnfg:#141414}}
:root[data-theme="dark"]{--bg:#141414;--fg:#f1f1f1;--mute:#a09a93;--soft:#333;--btn:#f1f1f1;--btnfg:#141414}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:21px/1.4 "Crimson Pro",Georgia,serif;font-variant-numeric:lining-nums}
.wrap{max-width:1120px;margin:0 auto;padding:28px 40px 60px}
.crumb{display:flex;gap:8px;align-items:center;font-size:18px}
.crumb i{width:18px;height:12px;background:#5b9be6;border-radius:2px;display:inline-block}
.crumb span{color:var(--mute)}
h1{font:600 58px/1.1 Fraunces,Georgia,serif;letter-spacing:-.02em;margin:30px 0 6px}
.sub{font:italic 500 28px "Cormorant Garamond",Georgia,serif;color:var(--mute);margin:0 0 36px}

/* Lưới chứa các thư mục ở trên */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:34px 24px}

a.tile{
  position:relative;
  display:flex;
  flex-direction:column;
  gap:8px;
  min-height:190px;
  margin-top:24px;
  padding:22px 26px 22px;
  border:1.5px solid color-mix(in srgb,var(--c) 45%,var(--soft));
  border-radius:0 20px 20px 20px;
  background:color-mix(in srgb,var(--c) 9%,var(--bg));
  color:inherit;
  text-decoration:none;
  box-shadow:0 4px 12px color-mix(in srgb,var(--c) 8%,transparent);
  transition:transform .2s cubic-bezier(.22,1,.36,1),box-shadow .2s ease,background .2s ease;
}
a.tile::before{
  content:"";
  position:absolute;
  top:-25px;
  left:-1.5px;
  width:136px;
  height:25px;
  background:color-mix(in srgb,var(--c) 24%,var(--bg));
  border:1.5px solid color-mix(in srgb,var(--c) 45%,var(--soft));
  border-bottom:none;
  border-radius:14px 18px 0 0;
  transition:background .2s ease;
}
a.tile::after{
  content:"";
  position:absolute;
  top:-2px;
  left:0;
  width:133px;
  height:4px;
  background:color-mix(in srgb,var(--c) 9%,var(--bg));
  transition:background .2s ease;
}
a.tile:hover{
  transform:translateY(-5px);
  background:color-mix(in srgb,var(--c) 14%,var(--bg));
  box-shadow:0 12px 24px color-mix(in srgb,var(--c) 18%,rgba(0,0,0,.08));
}
a.tile:hover::after{
  background:color-mix(in srgb,var(--c) 14%,var(--bg));
}
a.tile:focus-visible{outline:2px solid var(--fg);outline-offset:4px}

.dot{width:10px;height:10px;border-radius:50%;background:var(--c);position:absolute;top:-17px;left:16px;z-index:1}
.tile h2{font:italic 500 44px/1.1 "Cormorant Garamond",Georgia,serif;margin:0}
.tile p{margin:0;color:var(--mute);font-size:19px}
.foot{margin-top:auto;padding-top:10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.chip{display:inline-flex;align-items:center;height:26px;padding:0 13px;border-radius:99px;background:color-mix(in srgb,var(--c) 20%,var(--bg));border:1px solid color-mix(in srgb,var(--c) 35%,transparent);font:600 15px/1 "Crimson Pro",Georgia,serif}
.go{font-size:22px;color:var(--mute);transition:transform .15s}
a.tile:hover .go{transform:translateX(4px);color:var(--fg)}
a.tile.soon{opacity:.68}

/* Phần chuyển đổi kiểu chữ ở dưới (kiểu phiếu tiện ích gọn nhẹ, không dùng hình thư mục) */
.tools-sec{
  margin-top:46px;
  padding-top:26px;
  border-top:1px dashed var(--soft);
}
.tools-head{
  display:flex;
  align-items:baseline;
  gap:10px;
  margin-bottom:16px;
}
.tools-head h3{
  font:600 26px/1.1 Fraunces,Georgia,serif;
  margin:0;
}
.tools-head span{
  font:italic 500 21px "Cormorant Garamond",Georgia,serif;
  color:var(--mute);
}
.tools-row{
  display:flex;
  flex-wrap:wrap;
  gap:14px;
}
a.tool-slip{
  display:inline-flex;
  align-items:center;
  gap:16px;
  padding:14px 20px 14px 16px;
  border:1.5px solid var(--soft);
  border-radius:16px;
  background:color-mix(in srgb,var(--fg) 2.5%,var(--bg));
  color:inherit;
  text-decoration:none;
  transition:transform .18s ease,border-color .18s ease,background .18s ease,box-shadow .18s ease;
}
a.tool-slip:hover{
  transform:translateY(-3px);
  border-color:#9b87d6;
  background:color-mix(in srgb,#9b87d6 7%,var(--bg));
  box-shadow:0 8px 18px rgba(70,45,20,.08);
}
a.tool-slip:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.tool-icon{
  width:46px;
  height:46px;
  border-radius:12px;
  background:color-mix(in srgb,#9b87d6 18%,var(--bg));
  border:1px solid color-mix(in srgb,#9b87d6 35%,transparent);
  display:grid;
  place-items:center;
  font:600 20px/1 Fraunces,Georgia,serif;
  flex-shrink:0;
}
.tool-info{
  display:flex;
  flex-direction:column;
  gap:2px;
}
.tool-name{
  font:italic 600 26px/1.1 "Cormorant Garamond",Georgia,serif;
}
.tool-note{
  font-size:17px;
  color:var(--mute);
  line-height:1.25;
}
.tool-arrow{
  margin-left:8px;
  font-size:20px;
  color:var(--mute);
  transition:transform .15s,color .15s;
}
a.tool-slip:hover .tool-arrow{
  transform:translateX(4px);
  color:var(--fg);
}

@media (max-width:640px){
  .wrap{padding:20px 18px}
  body{font-size:19px}
  h1{font-size:44px}
  .grid{grid-template-columns:1fr;gap:24px}
  .tile h2{font-size:38px}
  a.tile{min-height:155px}
  a.tile::before{width:116px}
  a.tile::after{width:113px}
  a.tool-slip{width:100%}
  .tool-arrow{margin-left:auto}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="crumb"><i></i>home</div>
  <h1>ltqspace</h1>
  <p class="sub">web lộn xộn của LTQ</p>
  
  <div class="grid">
    <a class="tile" href="my_archive.html" style="--c:#e8a73a">
      <span class="dot"></span><h2>tài liệu nghiên cứu gay học</h2>
      <p>truyện đã đọc, đang đọc, sẽ đọc, kèm tiến độ và review</p>
      <div class="foot"><span class="chip" id="nb">mở</span><span class="go">→</span></div>
    </a>
    <a class="tile soon" href="#" data-soon style="--c:#e8909b">
      <span class="dot"></span><h2>youngpil</h2>
      <p>Young K × Wonpil</p>
      <div class="foot"><span class="chip">sắp có</span><span class="go">→</span></div>
    </a>
  </div>

  <!-- Phần chuyển đổi kiểu chữ gọn nhẹ ở dưới -->
  <div class="tools-sec">
    <div class="tools-head">
      <h3>tools</h3>
      <span>tiện ích dùng nhanh</span>
    </div>
    <div class="tools-row">
      <a class="tool-slip" href="change-case.html">
        <span class="tool-icon">Aa</span>
        <span class="tool-info">
          <span class="tool-name">chuyển đổi kiểu chữ</span>
          <span class="tool-note">đổi chữ hoa, chữ thường, viết hoa đầu câu</span>
        </span>
        <span class="tool-arrow">→</span>
      </a>
    </div>
  </div>
</div>

<script>
document.querySelectorAll("[data-soon]").forEach(a=>a.addEventListener("click",e=>e.preventDefault()));
try{const b=JSON.parse(localStorage.getItem("archive_v1"));if(Array.isArray(b))document.getElementById("nb").textContent=b.length+" truyện"}catch(e){}
</script>
</body>
</html>
